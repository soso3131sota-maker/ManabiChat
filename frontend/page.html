<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>学習ページ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
    }

    /* サイドバー */
    .sidebar {
      width: 200px;
      height: 100vh;
      background: #2c3e50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
    }
    .sidebar button, .back-button {
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #34495e;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar button:hover, .back-button:hover {
      background: #1abc9c;
    }

    /* メイン＋本エリア */
    .content-area {
      margin-left: 220px;
      display: flex;
      gap: 20px;
      padding: 20px;
      width: calc(100% - 220px);
    }

    .main-content {
      flex: 2;
    }
    .book-content {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow-y: auto;
      max-height: 90vh;
      display: none; /* 最初は非表示 */
      position: relative;
    }

    .book-content h2 {
      margin-top: 0;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      border: none;
      background: #e74c3c;
      color: white;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .close-btn:hover {
      background: #c0392b;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    /* チャットボックス */
    #chat-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      height: 450px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #fafafa;
      text-align: center;
    }
    .ai-message p { margin: 0.5em 0; }
    
    #start-btn {
      background-color: #28a745;
      padding: 12px 24px;
      font-size: 18px;
      margin-top: 185px;
    }
    #start-btn:hover {
        background-color: #218838;
    }

    /* 入力欄 */
    #user-input {
      width: 60%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .send-btn, .save-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #3498db;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: 5px;
    }
    .send-btn:hover, .save-btn:hover {
      background: #2980b9;
    }

    /* 保存履歴 */
    #saved-answers {
      list-style: none;
      padding: 0;
    }
    #saved-answers li {
      background: #ecf0f1;
      margin: 5px 0;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      border: none;
      background: #e74c3c;
      color: white;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #c0392b;
    }

    /* チャット吹き出し用のスタイル */
    .message-container {
      display: flex;
      margin: 10px 0;
      width: 100%;
    }
    .ai-message-container {
      justify-content: flex-start;
      position: relative; /* ▼▼▼【ここを追加】保存ボタンの位置の基準にする ▼▼▼ */
    }
    .user-message-container { justify-content: flex-end; }

    .message-bubble {
      max-width: 75%;
      padding: 10px 15px;
      border-radius: 20px;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .message-bubble p:first-child { margin-top: 0; }
    .message-bubble p:last-child { margin-bottom: 0; }
    .ai-message-container .message-bubble {
      background-color: #e9e9eb;
      color: #000;
      border-top-left-radius: 5px;
    }
    .user-message-container .message-bubble {
      background-color: #0b93f6;
      color: white;
      border-top-right-radius: 5px;
    }

    /* ▼▼▼【ここから追加】学習ノート保存ボタンのスタイル ▼▼▼ */
    .save-to-note-btn {
      position: absolute;
      top: -5px;
      right: 0px;
      padding: 4px 8px;
      font-size: 12px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0; /* 最初は非表示 */
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    /* ホバー時にボタンを表示 */
    .ai-message-container:hover .save-to-note-btn {
      opacity: 1;
      visibility: visible;
    }
    /* ▲▲▲ 【ここまで追加】 ▲▲▲ */
  </style>
</head>
<body class="page2">
  <div class="sidebar">
    <div class="sidebar-buttons">
      <button onclick="showSection('chat')">学習する</button>
      <button onclick="showSection('note')">学習ノートを見る</button>
      <button onclick="showSection('quiz')">問題を見る</button>
      <button onclick="toggleBook()">テキストを見る</button>
    </div>
    <a href="index.html" class="back-button">スタートページに戻る</a>
  </div>

  <div class="content-area">
    <div class="main-content">
      <div id="chat" class="section">
        <h2>AIと一緒に学習を進めよう</h2>
        <div id="chat-box">
            <button id="start-btn" class="send-btn" onclick="startChat()">はじめよう</button>
        </div>
        <input type="text" id="user-input" placeholder="質問を入力...">
        <button class="send-btn" onclick="sendMessage()">送信</button>
        <button class="save-btn" onclick="requestNoteCreation()">学習ノートを作る</button>
      </div>

      <div id="note" class="section" style="display:none;">
        <h2>学習ノート</h2>
        <button class="clear-btn" onclick="clearAll()">全消去</button>
        <ul id="saved-answers"></ul>
      </div>

      <div id="quiz" class="section" style="display:none;">
        <h2>問題がここに表示されます</h2>
        <p>ここに練習問題を載せることができます。</p>
      </div>
      
      </div>

    <div id="book" class="book-content">
      <button class="close-btn" onclick="toggleBook()">閉じる</button>
      <h2>テキストの内容</h2>
      <embed src="Python ゼロからはじめるプログラミング.pdf" type="application/pdf" width="100%" height="95%">
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
