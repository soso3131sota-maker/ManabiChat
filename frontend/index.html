<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 学習チャットボット</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <div id="sidebar">
            <div id="sidebar-header">
                <h2>保存したチャット</h2>
            </div>
            <div id="saved-chats-list"></div>
        </div>

        <div id="pdf-viewer">
            <embed src="Python ゼロからはじめるプログラミング.pdf" type="application/pdf" width="100%" height="100%" />
        </div>
        <div id="main-content">
            <div id="chat-header">
                <h2 id="chat-title">新規チャット</h2>
                <div>
                    <button id="new-chat-button">新しいチャット</button>
                    <button id="save-button">この会話を保存</button>
                </div>
            </div>
            <div id="chat-container">
                <div id="chat-box"></div>
                <div id="input-container">
                    <input type="text" id="user-input" placeholder="Pythonに関する質問を入力...">
                    <button id="send-button">送信</button>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
